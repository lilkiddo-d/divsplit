[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/src/config/generated" },
  { access = "read", path = "./script/config" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
